<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<script>try{var _t=localStorage.getItem('galTheme');if(!_t&&matchMedia('(prefers-color-scheme: dark)').matches)_t='dark';if(_t==='dark')document.documentElement.setAttribute('data-theme','dark')}catch(e){}</script>
<title>Klasemen Galatama</title>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--grid:#CFCFCF;--ink:#000;--muted:#4A4A4A;--sheet-bg:#F3F3F3;--cell-bg:#fff;--stripe:#DCEFE1;--head-bg:#1E8E3E;--green:#137E43;--red:#C0392B;--sel:#107C41;--fs:16px;--bd:#000;color-scheme:light}
html[data-theme=dark]{--sheet-bg:#0F1417;--cell-bg:#1C2429;--ink:#EEF3F0;--muted:#9FB0A8;--stripe:#26343B;--grid:#3A4A52;--head-bg:#1B7A3A;--green:#34C873;--sel:#34C873;--bd:#8DA0A8;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--sheet-bg);font:500 18px Lexend,'Segoe UI',Arial,sans-serif;color:var(--ink);padding:0 10px 60px;overflow-x:hidden}
body.solo{--inp:1.08em;--pt:1.85em}body.clan{--inp:1.4em;--pt:2.3em}
.wrap{width:1400px;margin:0 auto}body.clan .wrap{width:1700px}
.panel{background:var(--cell-bg);border:1px solid var(--grid);border-radius:0 0 4px 4px;padding:6px 14px 7px}
.col{min-width:0}body.duo{padding-bottom:0}html:has(body.duo){height:100%;overflow:hidden}body.duo{height:100vh;min-height:0;overflow:hidden}body.duo .fab{font-size:15px}body.duo .first-row{margin-bottom:10px}body.duo .tables table:not(.log-table){font-size:calc(var(--fs)*var(--ts,1))}body.duo .bottom-row{margin-top:0}body.duo .log-table td:nth-child(1){width:15%}body.duo .log-table td:nth-child(3){width:17%}body.duo table.log-table{font-size:calc(var(--fs)*var(--ts,1)*1.1)}body.duo .copyright{display:none}body.duo .log-scroll{height:100%;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;font-size:calc(var(--fs)*1.15)}body.duo table.log-table td{height:var(--lr,70px)}.tables{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:var(--fs)}
th{background:var(--head-bg);border:2px solid #000;color:#fff;font-weight:700;padding:.7em 2px;text-align:center}
th:nth-child(3){font-weight:800}th:nth-child(6),th:nth-child(7){font-size:.55em;white-space:nowrap;overflow:hidden}
body.clan thead,body.clan .solo-only,body.solo .clan-only{display:none}
tbody td{border:2px solid var(--bd);background:var(--cell-bg);vertical-align:middle;padding:0}
tbody tr.alt td{background:var(--stripe)}
td.rank{text-align:center;font-weight:800;font-size:1.2em}
td.center{text-align:center;padding:0 2px}td.poin-cell{text-align:center;padding:2px 1px}

/* Warna SOLO */
tr.zero:not(.blank) td.name-cell,tr.zero:not(.blank) td.poin-cell{background:#FFB0AA}
tr.pos td.name-cell,tr.pos td.poin-cell{background:#6FD383}
tr.rank-1 td.name-cell,tr.rank-1 td.poin-cell{background:#FFC400}
tr.rank-2 td.name-cell,tr.rank-2 td.poin-cell{background:#B8C4CC}
tr.rank-3 td.name-cell,tr.rank-3 td.poin-cell{background:#E58E3A}
tr.tie-0 td.name-cell,tr.tie-0 td.poin-cell{background:#B388FF}
tr.tie-1 td.name-cell,tr.tie-1 td.poin-cell{background:#26C6DA}
tr.tie-2 td.name-cell,tr.tie-2 td.poin-cell{background:#F06292}
tr.tie-3 td.name-cell,tr.tie-3 td.poin-cell{background:#A1887F}
tr.tie-4 td.name-cell,tr.tie-4 td.poin-cell{background:#5C7CFA}
tr.server td{background:#FFCC80!important;font-weight:800}
body.solo tr.pos input.team-name,body.solo tr.pos input.team-nick,body.solo tr.zero:not(.blank) input.team-name,body.solo tr.zero:not(.blank) input.team-nick,body.solo tr[class*=rank-] input.team-name,body.solo tr[class*=rank-] input.team-nick,body.solo tr[class*=tie-] input.team-name,body.solo tr[class*=tie-] input.team-nick,body.solo tr.server input{color:#000}
.medal{display:inline-flex;align-items:center;justify-content:center;width:1.7em;height:1.7em;border-radius:50%;font-weight:800;font-size:.95em;color:#222;border:2px solid rgba(0,0,0,.35)}
.medal.m1{background:linear-gradient(#FFE27A,#F5B700)}.medal.m2{background:linear-gradient(#F4F6F8,#AEB8C2)}.medal.m3{background:linear-gradient(#F0B27A,#B8691F);color:#fff}

/* Warna CLAN / DUO */
tr.cs td{border:none!important;background:transparent!important;height:10px}
tr.cr td:first-child,tr.ch td{border-left:2px solid var(--bd)}tr.cr td:last-child,tr.ch td{border-right:2px solid var(--bd)}
tr.cr.last td{border-bottom:2px solid var(--bd)}
tr.ch td{background:var(--head-bg);color:#fff;padding:.35em .8em;border-top:2px solid var(--bd);border-bottom:2px solid var(--bd)}
.chin{display:flex;align-items:center;gap:.7em}
input.clan-name{flex:1;min-width:0;border-radius:8px;font-weight:800;font-size:2.1em;line-height:1.15;font-family:inherit;letter-spacing:2px;text-transform:uppercase;padding:.05em .35em;color:#0B3D1E;background:#FFF8E1;border:3px solid #0B3D1E;border-left:12px solid var(--cc,#0B3D1E);box-shadow:0 3px 0 rgba(0,0,0,.35)}
input.clan-name:focus{outline:none;background:#fff}
.cinfo{display:flex;flex-direction:column;flex:none;font-size:.85em;font-weight:800;letter-spacing:1.5px;line-height:1.1;text-align:right}
.ctot{flex:none;text-align:center;background:#fff;color:#0B3D1E;border:3px solid #0B3D1E;border-radius:999px;box-shadow:0 3px 0 rgba(0,0,0,.35);padding:0 .6em;min-width:2.8em}
.ctot b{display:block;font-size:3.6em;font-weight:800;line-height:1}
.rkw svg{height:3.6em;width:auto;display:block}
tr.ch.rank-1 td{background:linear-gradient(90deg,#FFC400,#FFE680 50%,#FFC400);color:#000}
tr.ch.rank-2 td{background:linear-gradient(90deg,#B8C4CC,#E9EEF1 50%,#B8C4CC);color:#000}
tr.ch.rank-3 td{background:linear-gradient(90deg,#E58E3A,#F5B878 50%,#E58E3A);color:#000}
tr.cr.zero:not(.blank):not(.x) td{background:#E53935;color:#fff}
tr.cr.pos:not(.x):not(.y) td{background:#1FA35C;color:#fff}
tr.cr.mvp:not(.x):not(.y) td{background:#FFC400;color:#000}
tr.cr.low:not(.x):not(.y) td{background:#1565C0;color:#fff}
tr.cr.red:not(.x):not(.y) td{background:#E53935;color:#fff}
body.clan tr.cr input.team-name,body.clan tr.cr input.team-nick{color:inherit}
tr.mvp td.rank,tr.low td.rank{position:relative}
tr.mvp td.rank::before{content:'👑';position:absolute;top:3px;left:50%;transform:translateX(-50%);font-size:14px;line-height:1}
tr.mvp td.rank::after,tr.low td.rank::after{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:800;line-height:1}
tr.mvp td.rank::after{content:'MVP'}tr.low td.rank::after{content:'LAST'}
tr.low td.rank::before{content:'⬇';position:absolute;top:3px;left:50%;transform:translateX(-50%);font-size:13px;line-height:1}
td.rank.red-toggle{cursor:pointer;user-select:none}
tr.red:not(.cr) td{background:#E53935!important;color:#fff}tr.red input.team-name,tr.red input.team-nick{color:#fff!important}

@keyframes fu{0%,65%{background-color:#2ECC71}}@keyframes fd{0%,65%{background-color:#42A5F5}}
tr.flash-up td{animation:fu 2.4s ease-out}tr.flash-down td{animation:fd 2.4s ease-out}

/* Input */
input.team-name,input.team-nick{width:100%;border:none;background:transparent;font-family:inherit;font-weight:800;font-size:var(--inp);color:var(--ink);padding:.4em .2em;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
input.team-name::placeholder,input.team-nick::placeholder{color:var(--muted);opacity:.6;font-weight:500}
tr input.team-name:focus,tr input.team-nick:focus{outline:none;background:#fff!important;color:#000!important;box-shadow:inset 0 0 0 2px var(--sel);text-align:left}
.points-wrap{display:flex;align-items:center;justify-content:center;max-width:100%;overflow:hidden}.points-wrap>*{flex-shrink:0}
input.points{width:1.5em;border:3px solid rgba(0,0,0,.6);border-radius:6px;background:#fff;font-family:inherit;font-weight:800;font-size:var(--pt);color:#000;-webkit-text-fill-color:#000;text-align:center;padding:0 .1em;height:1.15em;line-height:1.2;margin-right:.08em;cursor:default}
input.points:focus{outline:none}
.pm-btn{width:2.3em;height:1.5em;margin:0 .15em;border-radius:6px;border:2px solid var(--green);background:#E6F5EC;color:var(--green);font-weight:800;font-size:.9em;font-family:inherit;cursor:pointer;padding:0}
.fish-btn{width:2.1em;height:1.8em;padding:0;border-radius:9px;border:2px solid #E09A00;background:linear-gradient(#FFF8E1,#FFD966);cursor:pointer;display:flex;align-items:center;justify-content:center}
.fish-btn img{height:1.5em;pointer-events:none}
input.pay-input{width:100%;border-radius:8px;font-weight:800;font-size:1.15em;font-family:inherit;text-align:center;padding:.3em 0;text-transform:uppercase;background:#FFE9E7;border:2px solid #E5484D;color:#C62828}
input.pay-input:focus{outline:none}input.pay-input.locked{cursor:pointer;caret-color:transparent}
input.pay-input.done{background:#1FA35C;border-color:#137E43;color:#fff}
.join-btn,.hist-btn{width:100%;height:2em;border-radius:4px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0;font-family:inherit;position:relative;background:var(--cell-bg);color:var(--muted)}
.join-btn{font-size:1.3em;font-weight:800;border:2px solid #777;color:transparent}.join-btn.joined{background:#1FA35C;border-color:#137E43;color:#fff}
.hist-btn{border:1px solid var(--grid)}.hist-btn .ico{width:1.2em;height:1.2em}
.hist-count{position:absolute;top:-.4em;right:-.4em;min-width:14px;height:14px;padding:0 3px;border-radius:7px;background:var(--red);color:#fff;font-size:9px;display:flex;align-items:center;justify-content:center}
.ico{width:1.05em;height:1.05em;display:block}

/* Modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;align-items:center;justify-content:center;padding:16px}.modal-overlay.open{display:flex}
.modal-box{width:100%;max-width:680px;max-height:90vh;display:flex;flex-direction:column;background:var(--cell-bg);color:var(--ink);border:2px solid var(--grid);border-radius:8px;box-shadow:0 16px 48px rgba(0,0,0,.35);overflow:hidden}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 22px;background:var(--head-bg);color:#fff}
.modal-title{font-weight:700;font-size:28px}.modal-title small{display:block;font-weight:500;font-size:20px;opacity:.9}
.modal-close{width:48px;height:48px;border-radius:4px;border:2px solid var(--grid);background:var(--cell-bg);color:var(--muted);font-size:24px;cursor:pointer;flex:none}
.modal-body{overflow-y:auto;padding:10px 22px 22px}
.hist-empty{text-align:center;color:var(--muted);font-size:22px;padding:40px 10px}
.hist-list{list-style:none;margin:0;padding:0}
.hist-item,.adm-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 0;border-bottom:2px solid var(--grid)}
.hist-delta{font-weight:800;font-size:36px;min-width:100px}.pos-c{color:var(--green)}.neg-c{color:var(--red)}
.hist-meta{flex:1;text-align:right}.hist-time{font-size:22px;color:var(--muted);display:block}.hist-after{font-size:24px;font-weight:700;display:block}.hist-fish{display:block;font-size:20px;font-weight:600;color:#E65100}
.adm-total{display:flex;align-items:center;justify-content:space-between;margin:14px 0 6px;padding:14px 18px;background:#E6F5EC;color:#0B4A28;border:2px solid var(--green);border-radius:6px}
.adm-total span{font-weight:700;font-size:22px}.adm-total b{font-size:44px;line-height:1}
.adm-row{font-size:20px;padding:10px 0}.adm-name{flex:1;min-width:0;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.adm-nums{color:var(--muted);font-size:18px}.adm-sub{min-width:56px;text-align:right;font-weight:800;font-size:24px}
.fish-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 18px;border-top:2px solid var(--grid)}
.fish-ok{background:var(--green);color:#fff;border:none;border-radius:6px;font-weight:700;font-size:20px;font-family:inherit;padding:10px 24px;cursor:pointer}
#fishModal,#pmModal{background:transparent;align-items:flex-start;justify-content:flex-start;padding:0}
#fishModal .modal-box,#pmModal .modal-box{position:absolute;box-shadow:0 6px 18px rgba(0,0,0,.4)}
#fishModal .modal-box{width:290px}#pmModal .modal-box{width:min(310px,calc(100vw - 16px))}
#fishModal .modal-head,#pmModal .modal-head{padding:6px 10px}
#fishModal .modal-title,#pmModal .modal-title{font-size:16px;line-height:1.1}#fishModal small,#pmModal small{font-size:13px}
#fishModal .modal-close,#pmModal .modal-close{width:26px;height:26px;font-size:14px}
#fishList{padding:6px 9px;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;overflow:visible}
.fish-opt{display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 2px;border-radius:5px;border:2px solid var(--green);background:#E6F5EC;color:#0B4A28;font-weight:800;font-size:12px;line-height:1.1;font-family:inherit;cursor:pointer}
.fish-opt .fp{font-size:16px}.fish-opt.sel{background:var(--green);color:#fff}
#fishModal .fish-foot{display:block;padding:0 9px 9px;border:0}#fishModal .fish-foot>span{display:none}#fishModal .fish-ok{width:100%;font-size:16px;padding:7px}
.pm-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:10px}
.pm-grid button{height:40px;border-radius:6px;font-weight:800;font-size:16px;font-family:inherit;cursor:pointer}
.pm-plus{border:2px solid #137E43;color:#137E43;background:#E6F5EC}.pm-minus{border:2px solid #E5484D;color:#C62828;background:#FFE9E7}
html[data-theme=dark] .fish-opt,html[data-theme=dark] .pm-plus,html[data-theme=dark] .adm-total{background:#1E3A2A;color:#7CE3A5}
html[data-theme=dark] .pm-minus{background:#3B1E1E;color:#FF8A80}

/* Bar atas */
.top-row{margin:0 0 5px}
.badge-row{--h:112px;display:flex;flex-wrap:wrap;align-items:stretch;gap:10px 14px}
.badge-row>*{height:var(--h)}
.slot-badge{display:inline-flex;align-items:center;gap:.15em;font-weight:700;font-size:calc(var(--fs)*2.7);white-space:nowrap;padding:0 .4em 0 .7em;border-radius:999px;background:var(--stripe);border:2px solid var(--head-bg)}
.slot-badge>span:first-child{font-size:.6em}
.slot-num{min-width:1.8em;padding:.05em .5em;border-radius:999px;background:var(--green);color:#fff;text-align:center;font-weight:800;font-size:1.5em;line-height:1.25}
.slot-badge.full .slot-num{background:var(--red)}
.slot-badge input{border:2px solid var(--head-bg);border-radius:6px;background:var(--cell-bg);font-weight:800;font-size:1em;font-family:inherit;text-align:center;color:var(--ink);min-width:0;height:calc(var(--h) - 28px);padding:0 .3em}
.slot-badge input:focus{outline:none;border-color:var(--sel)}
#plusDefault{width:1.9em}
.usn-set{flex:1 0 auto}.usn-set input{flex:1 0 auto;width:5.2em;font-weight:700}.map-set input{text-transform:uppercase}
.usn-set input::placeholder{color:#8A8A8A;font-weight:500;text-transform:none}
#slotInfo{gap:.2em;padding-left:.5em}#slotInfo>.slot-label{font-size:1.7em;font-weight:800}

/* Timer */
.timer-wrap{display:inline-flex;gap:3px}
.timer-disp{display:flex;align-items:center;justify-content:center;gap:.25em;width:5.2em;height:100%;overflow:hidden;border:2px solid var(--head-bg);border-radius:8px;background:var(--cell-bg);font-weight:800;font-size:calc(var(--fs)*3.1);font-variant-numeric:tabular-nums;white-space:nowrap}
.timer-sub{display:none;font-size:.28em;font-weight:800;text-align:right;line-height:1.1}
.timer-disp.cd{background:#FFF3C4;border-color:#EF6C00;color:#B34700}.timer-disp.cd .timer-sub,.timer-disp.end .timer-sub{display:block}
.timer-disp.warn{border-color:#E53935;color:#E53935;animation:tb 1s steps(1) infinite}
.timer-disp.end{background:#E53935;border-color:#B71C1C;color:#fff;animation:tb .7s steps(1) infinite}
.timer-disp.fin{background:#C62828;border-color:#7F0000;color:#fff}.timer-disp.paused{color:#777}
@keyframes tb{50%{background:#FFCDD2;color:#B71C1C}}
.timer-btns{display:flex;flex-direction:column;gap:3px}
.timer-btns button{flex:1;width:2.1em;border:2px solid #777;border-radius:5px;background:var(--cell-bg);color:var(--muted);cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center}
.timer-btns svg{width:1.5em;height:1.5em}#tPlay{background:#E6F5EC;border-color:var(--green);color:var(--green)}
.t-fields{display:flex;gap:12px;margin:12px 0}.t-fields label{flex:1;font-weight:700;font-size:20px;display:flex;flex-direction:column;gap:6px;text-align:center}
.t-fields input{width:100%;font-weight:800;font-size:32px;font-family:inherit;text-align:center;border:2px solid var(--head-bg);border-radius:8px;padding:6px 0;background:var(--cell-bg);color:var(--ink)}
.cd-alert{position:fixed;left:50%;top:32%;transform:translate(-50%,-50%) scale(.8);z-index:120;pointer-events:none;opacity:0;transition:.15s;font-weight:800;color:#fff;background:rgba(20,20,20,.88);border:3px solid #fff;border-radius:14px;padding:.2em .7em;font-size:34px;white-space:nowrap}
.cd-alert.show{opacity:1;transform:translate(-50%,-50%) scale(1)}.cd-alert.warn{background:#E65100}.cd-alert.num{font-size:84px;background:#C62828}.cd-alert.end{background:#B71C1C}

/* Search */
.search-bar{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);width:760px;max-width:calc(100vw - 28px);display:flex;align-items:center;gap:16px;padding:16px 24px;background:#2b2b2d;border-radius:14px;z-index:90;visibility:hidden;opacity:0}
body.search-open .search-bar{visibility:visible;opacity:1}
#searchInput{flex:1;min-width:0;border:none;background:transparent;font-weight:500;font-size:34px;font-family:inherit;color:#fff}#searchInput:focus{outline:none}
#searchCount{display:none;color:#c8c8cc;font-size:20px;white-space:nowrap}#searchCount.none{color:#ff8a80}
.search-nav,#searchClear{width:2.4em;height:2.4em;border:0;background:transparent;color:#c8c8cc;border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.search-nav svg{width:1.1em;height:1.1em}
.fab{position:fixed;bottom:calc(6px + env(safe-area-inset-bottom,0px));width:3.2em;height:3.2em;border-radius:50%;border:2px solid #fff;background:#2b2b2d;color:#FFD54F;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:89;padding:0;box-shadow:0 4px 12px rgba(0,0,0,.35)}
.fab svg{width:1.4em;height:1.4em}#searchFab{left:50%;transform:translateX(-50%);color:#fff}#themeFab{right:18px}
#menuFab{left:18px;font-weight:800;font-size:14px;font-family:inherit;color:#fff;width:auto;border-radius:999px;padding:0 1.2em;height:2.6em}
body.search-open #searchFab{display:none}
html[data-theme=dark] .i-sun,.i-moon{display:none}html[data-theme=dark] .i-moon{display:block}
body.searching tbody tr{opacity:.3}body.searching tbody tr.search-hit{opacity:1}
tr.search-hit td{background:#FFF176!important;color:#000!important;box-shadow:inset 0 4px 0 #E65100,inset 0 -4px 0 #E65100}
tr.search-hit.search-cur td{background:#FFC107!important}

/* Log */
.bottom-row{display:flex;align-items:flex-start;gap:14px;margin-top:6px}
.log-panel{flex:1;min-width:0;border:2px solid var(--bd)}.log-scroll{font-size:calc(var(--fs)*1.1);height:calc(var(--fs)*12.75 + 2px);overflow-y:auto}
table.log-table td{height:2.1em;border:2px solid var(--bd);padding:.2em .5em;text-align:center;font-weight:800;color:var(--ink);background:var(--cell-bg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.log-table td:nth-child(1){width:9%}.log-table td:nth-child(2){width:19%}.log-table td:nth-child(3){width:22%}.log-table td:nth-child(4),.log-table td:nth-child(5){width:6%}
.log-table td.l{text-align:left}.log-table td.up{color:var(--green)}.log-table td.down{color:var(--red)}
.log-table tr:nth-child(even) td{background:var(--stripe)}
.log-table tr:nth-child(1) td{background:#FFEB3B;color:#000}.log-table tr:nth-child(2) td{background:#A5D6A7;color:#000}.log-table tr:nth-child(3) td{background:#DCEDC8;color:#000}
.log-table tr:nth-child(-n+3) td.up{color:#137E43}.log-table tr:nth-child(-n+3) td.down{color:#C0392B}
.copyright{flex:none;padding:0 8px;font-size:calc(var(--fs)*1.7);width:min-content;text-align:center;line-height:1.1;font-weight:800;color:#D32F2F;user-select:none}
.adm-trigger{cursor:pointer}
#ptStack{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:200;display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none}
.pt-toast{display:flex;align-items:center;gap:28px;min-width:340px;padding:16px 30px;background:#1C2429;border:3px solid #1FA35C;border-radius:18px;color:#fff;opacity:0;transform:scale(.85);transition:.25s}
.pt-toast.show{opacity:1;transform:scale(1)}.pt-toast.neg{border-color:#E5484D}
.pt-delta{font-size:44px;font-weight:800;color:#2ED573}.pt-toast.neg .pt-delta{color:#FF6B6B}
.pt-who{font-size:26px;font-weight:800}.pt-after{font-size:22px;color:#C9D3D0}.pt-after b{font-size:1.5em;color:#FFC400}.pt-label{font-size:18px;color:#FFA726}

/* Menu pilihan */
#menu{position:fixed;inset:0;z-index:300;background:var(--sheet-bg);display:none;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:20px}
#menu.open{display:flex}
#menu h1{margin:0;font-size:clamp(28px,5vw,52px);color:var(--ink)}
.menu-btns{display:flex;gap:24px;flex-wrap:wrap;justify-content:center}
.menu-btns button{width:min(340px,86vw);padding:38px 20px;border-radius:18px;border:4px solid var(--head-bg);background:var(--stripe);color:var(--ink);font-weight:800;font-size:clamp(24px,4vw,38px);font-family:inherit;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.25)}
.menu-btns button small{display:block;margin-top:8px;font-size:.45em;font-weight:500;color:var(--muted)}
.menu-btns button:hover{background:var(--head-bg);color:#fff}.menu-btns button:hover small{color:#E0F2E7}

/* ===== Penyesuaian tampilan Solo (seperti aslinya) ===== */
body.solo{--k:1}body.clan{--k:1.214}
.badge-row{--h:calc(72px*var(--k));gap:8px 10px}
.badge-row .slot-badge{font-size:calc(var(--fs)*1.75*var(--k));padding:0 .35em 0 .7em}
.badge-row .slot-badge>span:first-child{font-size:.62em}
.slot-badge input{font-size:1em;height:calc(var(--h) - 16px)}
#plusDefault{width:1.9em}
.timer-disp{font-size:calc(var(--fs)*2.2*var(--k));width:4.7em}
.timer-btns button{width:calc(30px*var(--k))}.timer-btns svg{width:calc(19px*var(--k));height:calc(19px*var(--k))}
body.solo td.rank{font-size:1.1em}
body.solo input.team-name,body.solo input.team-nick{padding:.75em .3em}
body.solo .bottom-row .copyright{font-size:calc(var(--fs)*1.4)}
.pill{position:fixed;top:calc(3px + env(safe-area-inset-top,0px));z-index:95;display:none;align-items:center;border:1px solid var(--head-bg);border-radius:999px;overflow:hidden;background:var(--cell-bg);color:var(--ink);font-size:11px;font-weight:700;font-family:inherit;box-shadow:0 2px 6px rgba(0,0,0,.3);opacity:.6;transition:opacity .15s}
.pill:hover{opacity:1}body.solo .pill{display:inline-flex}
.pill button{border:0;background:transparent;color:inherit;font-family:inherit;font-weight:700;font-size:1em;padding:.2em .7em;cursor:pointer;white-space:nowrap}
.pill button.on{background:var(--head-bg);color:#fff}
/* Dark Clan seperti aslinya */
html[data-theme=dark] body.clan input.points{background:#11181C;color:var(--ink);-webkit-text-fill-color:var(--ink)}
html[data-theme=dark] body.clan .join-btn,html[data-theme=dark] body.clan .hist-btn{background:#11181C;color:var(--ink)}
html[data-theme=dark] body.clan .join-btn.joined{background:#1FA35C;color:#fff}
html[data-theme=dark] body.solo .join-btn:not(.joined){background:#2A2A2A;border-color:#8A8A8A}

#fishList .fish-opt{position:relative}
#fishList .fish-opt.sel,html[data-theme=dark] #fishList .fish-opt.sel{background:#FFC400;border-color:#fff;color:#000;box-shadow:0 0 0 2px #FFC400,0 2px 8px rgba(0,0,0,.5);transform:scale(1.05);z-index:1}
#fishList .fish-opt.sel::after{content:'✓';position:absolute;top:-6px;right:-6px;width:17px;height:17px;border-radius:50%;background:#137E43;color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;border:1px solid #fff}
body.solo .log-scroll{font-size:var(--fs);height:calc(10.5em + 2px)}
</style>
</head>
<body>
<div id="menu" class="open">
  <h1>Klasemen Galatama</h1>
  <div class="menu-btns">
    <button data-mode="solo">🎣 Galatama Solo<small>20 peserta · ranking perorangan</small></button>
    <button data-mode="duo">👥 Galatama Duo<small>9 tim × 2 akun · ranking tim</small></button>
    <button data-mode="clan">🛡️ Galatama Clan<small>6 clan × 3 akun · ranking clan</small></button>
  </div>
</div>

<div class="wrap"><div class="panel">
  <div class="top-row">
    <div class="search-bar">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="#B0B0B0" stroke-width="2.6" stroke-linecap="round" style="font-size:30px"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg>
      <input type="text" id="searchInput" placeholder="Find..." autocomplete="off">
      <span id="searchCount"></span>
      <button type="button" class="search-nav" id="searchPrev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg></button>
      <button type="button" class="search-nav" id="searchNext"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
      <button type="button" id="searchClear">✕</button>
    </div>
    <div class="badge-row">
      <div class="slot-badge solo-only" title="Poin bonus otomatis jika kolom Pay berisi BIN"><span>+POINT</span><input type="number" id="plusDefault" value="0" step="1"></div>
      <div class="slot-badge usn-set"><span>ADD</span><input type="text" id="addUsn" placeholder="isi USN..." autocomplete="off" spellcheck="false"></div>
      <div class="slot-badge usn-set map-set"><span>MAP</span><input type="text" id="addMap" list="mapList" placeholder="pilih map..." autocomplete="off" spellcheck="false"></div>
      <div class="timer-wrap">
        <div class="timer-disp" id="timerDisp"><span class="timer-sub" id="timerSub"></span><span id="timerTxt">1:10:00</span></div>
        <div class="timer-btns">
          <button type="button" id="tPlay"></button>
          <button type="button" id="tReset" title="Reset"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 3-6.2"/><path d="M4 4v5h5"/></svg></button>
          <button type="button" id="tSet" title="Atur durasi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg></button>
        </div>
      </div>
      <datalist id="mapList"></datalist>
      <div class="slot-badge" id="slotInfo" title="Jumlah slot yang masih kosong"><span class="slot-label">-</span><span class="slot-num" id="slotLeft">0</span></div>
    </div>
  </div>
  <div class="tables first-row" id="firstRow" style="display:none"><div class="col"><table><colgroup></colgroup><thead><tr><th>NO</th><th>NAMA</th><th>Pay</th><th>DISPLAY NAMA</th><th>POINT</th><th>Absen</th><th>History</th></tr></thead><tbody id="tableBodyFirst"></tbody></table></div><div class="col" id="colF"></div></div>
  <div class="tables" id="mainTables"><div class="col" id="colL">
    <table><colgroup></colgroup><thead><tr><th>NO</th><th>NAMA</th><th>Pay</th><th>DISPLAY NAMA</th><th>POINT</th><th>Absen</th><th>History</th></tr></thead><tbody id="tableBodyTop"></tbody></table></div><div class="col" id="colR">
    <table><colgroup></colgroup><thead><tr><th>NO</th><th>NAMA</th><th>Pay</th><th>DISPLAY NAMA</th><th>POINT</th><th>Absen</th><th>History</th></tr></thead><tbody id="tableBodyBottom"></tbody></table></div>
  </div>
  <div class="bottom-row">
    <div class="log-panel"><div class="log-scroll"><table class="log-table"><tbody id="logBody"></tbody></table></div></div>
    <div class="copyright">&copy;<span class="adm-trigger" id="admTrigger">Created</span> By Aaronnn</div>
  </div>
</div></div>

<div class="cd-alert" id="cdAlert"></div>
<div id="ptStack"></div>
<button type="button" class="fab" id="menuFab" title="Ganti mode">⇄ Mode</button>
<button type="button" class="fab" id="searchFab" title="Cari (Ctrl+F)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg></button>
<button type="button" class="fab" id="themeFab" title="Siang / malam"><svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg><svg class="i-moon" viewBox="0 0 24 24" fill="#CFD8DC"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/></svg></button>

<div class="modal-overlay" id="histModal"><div class="modal-box"><div class="modal-head"><div class="modal-title">History<small id="histSub"></small></div><button type="button" class="modal-close" data-close>✕</button></div><div class="modal-body" id="histBody"></div></div></div>
<div class="modal-overlay" id="admModal"><div class="modal-box"><div class="modal-head" style="background:#263238"><div class="modal-title">Menu Admin<small>Total angka di kolom Pay</small></div><button type="button" class="modal-close" data-close>✕</button></div><div class="modal-body" id="admBody"></div></div></div>
<div class="modal-overlay" id="tModal"><div class="modal-box" style="max-width:420px"><div class="modal-head"><div class="modal-title">Atur Waktu<small>Durasi timer</small></div><button type="button" class="modal-close" data-close>✕</button></div><div class="modal-body"><div class="t-fields"><label>Jam<input type="number" id="tH" min="0" max="99"></label><label>Menit<input type="number" id="tM" min="0" max="59"></label><label>Detik<input type="number" id="tS" min="0" max="59"></label></div><div style="text-align:right"><button type="button" class="fish-ok" id="tOk">Simpan</button></div></div></div></div>
<div class="modal-overlay" id="fishModal"><div class="modal-box"><div class="modal-head"><div class="modal-title">Tarik Ikan<small id="fishSub"></small></div><button type="button" class="modal-close" data-close>✕</button></div><div id="fishList"></div><div class="fish-foot"><span>Total: <b id="fishTotal">+0</b></span><button type="button" class="fish-ok" id="fishOk">Tambah</button></div></div></div>
<div class="modal-overlay" id="pmModal"><div class="modal-box"><div class="modal-head"><div class="modal-title">Tambah / Kurang Poin<small id="pmSub"></small></div><button type="button" class="modal-close" data-close>✕</button></div><div class="pm-grid" id="pmGrid"></div></div></div>

<script>
const $=id=>document.getElementById(id), $$=s=>document.querySelectorAll(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mk=(tag,cls,html)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e};
const base=o=>({name:'',nickname:'',points:0,binGiven:0,pay:'',paid:false,joined:false,red:false,history:[],flash:null,...o});

// ===== DATA =====
let M=null; // 'solo' | 'duo' | 'clan'
const solo=Array.from({length:20},(_,i)=>base({id:i+1}));
Object.assign(solo[19],{name:'Admin',nickname:'Admin',joined:true,pay:'D',paid:true});
// Clan: 6 clan x 3 akun
const clansC=Array.from({length:6},(_,i)=>({id:i+1,name:'Clan '+(i+1),flash:null}));
const clanTC=Array.from({length:18},(_,i)=>base({id:i+1,clan:Math.floor(i/3)+1,slot:i%3}));
// Duo: 9 tim x 2 akun
const clansD=Array.from({length:9},(_,i)=>({id:i+1,name:'Tim '+(i+1),flash:null}));
const clanTD=Array.from({length:18},(_,i)=>base({id:i+1,clan:Math.floor(i/2)+1,slot:i%2}));
const CL=()=>M==='duo'?clansD:clansC, CT=()=>M==='duo'?clanTD:clanTC;
const LETTER=['A','B','C'], CLAN_COLORS=['#1565C0','#7B1FA2','#00838F','#EF6C00','#C2185B','#2E7D32','#D84315','#455A64','#6D4C41'];
const TS=()=>M==='solo'?solo:CT();
const getT=id=>TS().find(x=>x.id===id), getC=id=>CL()[id-1];
const cTeams=c=>CT().filter(t=>t.clan===c.id), cTotal=c=>cTeams(c).reduce((a,t)=>a+t.points,0);
const who=t=>t.nickname||t.name||('Peserta #'+t.id);
const fmtTime=ts=>{const d=new Date(ts),p=n=>String(n).padStart(2,'0');return p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds())};
const FISH_IMG='data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF0A0"/><stop offset="1" stop-color="#F59E0B"/></linearGradient></defs><circle cx="28" cy="36" r="26" fill="url(#g)" stroke="#7A3E00" stroke-width="4"/><circle cx="28" cy="36" r="19" fill="#FFD54F" stroke="#B66A00" stroke-width="2.5"/><path fill-rule="evenodd" fill="#7A3E00" d="M20 22h13a9 9 0 0 1 0 18h-6v10h-7zM27 28v6h6a3 3 0 0 0 0-6z"/><circle cx="49" cy="15" r="15" fill="#22C55E" stroke="#fff" stroke-width="3"/><path d="M49 7V23M41 15H57" stroke="#fff" stroke-width="6" stroke-linecap="round"/></svg>');
const FLASH_MS=2400;

// ===== Suara & notifikasi =====
let ac=null,toastTimer=null;
function beep(f,len,vol,at){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();const o=ac.createOscillator(),g=ac.createGain(),t0=ac.currentTime+(at||0);o.frequency.value=f;g.gain.setValueAtTime(vol||.25,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+len);o.connect(g);g.connect(ac.destination);o.start(t0);o.stop(t0+len+.02)}catch(e){}}
const tone=d=>d>0?(beep(880,.14,.3),beep(1320,.22,.3,.09)):(beep(520,.14,.3),beep(330,.26,.3,.09));
function toast(t,d,after,label){ // notif bisa muncul bersamaan: ditumpuk atas-bawah (terbaru di bawah)
  const stack=$('ptStack');
  const el=mk('div','pt-toast'+(d<0?' neg':''),'<span class="pt-delta"></span><div><div class="pt-who"></div><div class="pt-after">Poin jadi <b></b></div><div class="pt-label"></div></div>');
  el.querySelector('.pt-delta').textContent=(d>0?'+':'\u2212')+Math.abs(d);
  el.querySelector('.pt-who').textContent=who(t);el.querySelector('.pt-after b').textContent=after;
  const lb=el.querySelector('.pt-label');lb.textContent=label||'';lb.style.display=label?'block':'none';
  stack.appendChild(el);while(stack.children.length>4)stack.firstChild.remove();
  requestAnimationFrame(()=>el.classList.add('show'));
  setTimeout(()=>{el.classList.remove('show');setTimeout(()=>el.remove(),280)},2500);
}
function applyDelta(t,d,label){
  const np=Math.max(0,t.points+d),a=np-t.points;t.points=np;
  if(a){const f={dir:a>0?'up':'down',time:Date.now()};t.flash=f;if(t.clan)getC(t.clan).flash=f;
    t.history.push({delta:a,after:np,time:Date.now(),label});toast(t,a,np,label);tone(a)}
  return a;
}
function syncBin(t){ // bonus BIN (hanya Solo)
  const has=/bin/i.test(t.pay||'');
  if(has&&!t.binGiven){const amt=parseInt($('plusDefault').value,10)||0;if(!amt)return false;t.binGiven=amt;applyDelta(t,amt,'Bonus Bin')}
  else if(!has&&t.binGiven){const g=t.binGiven;t.binGiven=0;applyDelta(t,-g,'Bin dibatalkan')}
  else return false;
  return true;
}

// ===== Ranking =====
let cr={},tie={};
function ranks(a,v,b){
  cr={};tie={};
  if(a.every(t=>v(t)===0||v(t)===b(t))){a.forEach((t,i)=>cr[t.id]=i+1);return}
  a.forEach(t=>cr[t.id]=1+a.filter(o=>v(o)>v(t)).length);
  if(M!=='solo')return;
  const cnt={};a.slice(0,10).forEach(t=>{if(t.points>0&&cr[t.id]<=3)cnt[t.points]=(cnt[t.points]||0)+1});
  let i=0;a.slice(0,10).forEach(t=>{if(t.points>0&&cnt[t.points]>1&&tie[t.points]===undefined)tie[t.points]=i++%5});
}
let timerEnded=false;
function markClan(){ // MVP & LAST (Clan & Duo)
  $$('tr.mvp,tr.low').forEach(r=>r.classList.remove('mvp','low'));
  if(M==='solo'||!M)return;
  const T=CT();
  const max=Math.max(0,...T.map(t=>t.points));
  if(max>0)T.filter(t=>t.points===max).forEach(t=>document.querySelector('tr[data-id="'+t.id+'"]')?.classList.add('mvp'));
  if(!timerEnded)return;
  const pl=T.filter(t=>t.name.trim()||t.nickname.trim());if(!pl.length)return;
  const min=Math.min(...pl.map(t=>t.points));if(min===max)return;
  pl.filter(t=>t.points===min).forEach(t=>document.querySelector('tr[data-id="'+t.id+'"]')?.classList.add('low'));
}
function updateSlotInfo(){
  const left=M==='solo'?solo.filter(t=>!t.name.trim()).length:CL().filter(c=>cTeams(c).some(t=>!t.name.trim())).length;
  $('slotLeft').textContent=left;$('slotInfo').classList.toggle('full',left===0);
}

// ===== Log global =====
function renderLog(){
  let all=[];TS().forEach(t=>t.history.forEach(h=>all.push({t,h})));all.sort((a,b)=>b.h.time-a.h.time);// Duo: 3 baris terlihat, sisanya bisa di-scroll
  const body=$('logBody');
  if(!all.length){body.innerHTML='<tr><td colspan="6" style="font-weight:500;color:var(--muted)">Belum ada perubahan poin.</td></tr>';return}
  body.innerHTML=all.map(({t,h})=>{
    const nm=(t.name||'').trim()||(t.clan?LETTER[t.slot]:'-');
    return '<tr><td>'+fmtTime(h.time)+'</td><td class="l">'+esc(t.clan?getC(t.clan).name+' · '+nm:nm)+'</td><td class="l">'+(esc((t.nickname||'').trim())||'-')+'</td><td class="'+(h.delta>0?'up':'down')+'">'+(h.delta>0?'+':'')+h.delta+'</td><td>'+h.after+'</td><td class="l">'+esc(h.label||'-')+'</td></tr>';
  }).join('');
  body.closest('.log-scroll').scrollTop=0;
}

// ===== Search =====
let sIdx=0;const sIn=$('searchInput');
function markCur(scroll){
  const hits=[...$$('tr.search-hit')];$$('tr.search-cur').forEach(r=>r.classList.remove('search-cur'));
  if(!hits.length)return;sIdx=((sIdx%hits.length)+hits.length)%hits.length;
  hits[sIdx].classList.add('search-cur');if(scroll)hits[sIdx].scrollIntoView({block:'center',behavior:'smooth'});
}
function applySearch(scroll){
  const q=sIn.value.trim().toLowerCase();let n=0;
  $$('tr[data-id]').forEach(tr=>{const t=getT(+tr.dataset.id),h=!!q&&!!t&&(t.nickname||'').toLowerCase().includes(q);tr.classList.toggle('search-hit',h);if(h)n++});
  document.body.classList.toggle('searching',!!q);
  const c=$('searchCount');c.style.display=q?'inline-block':'none';c.classList.toggle('none',!!q&&!n);c.textContent=n?n+' ditemukan':'Tidak ditemukan';
  markCur(!!scroll);
}
const openSearch=()=>{document.body.classList.add('search-open');sIn.focus({preventScroll:true});sIn.select()};
const closeSearch=()=>{sIn.value='';applySearch();document.body.classList.remove('search-open');sIn.blur()};
sIn.addEventListener('input',()=>{sIdx=0;applySearch(true)});
sIn.addEventListener('keydown',e=>{
  if(e.key==='Enter'){e.preventDefault();const h=document.querySelector('tr.search-cur')||document.querySelector('tr.search-hit');if(h)openFish(+h.dataset.id)}
  else if(e.key==='Escape')closeSearch();
});
sIn.addEventListener('blur',()=>setTimeout(()=>{if(!sIn.value.trim()&&document.activeElement!==sIn&&!$('fishModal').classList.contains('open'))document.body.classList.remove('search-open')},150));
$('searchClear').addEventListener('mousedown',e=>e.preventDefault());$('searchClear').addEventListener('click',closeSearch);
$('searchFab').addEventListener('click',openSearch);
['searchPrev','searchNext'].forEach(id=>{const b=$(id);b.addEventListener('mousedown',e=>e.preventDefault());b.addEventListener('click',()=>{sIdx+=id==='searchNext'?1:-1;markCur(true)})});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&!e.altKey&&e.key.toLowerCase()==='f'&&M){e.preventDefault();closeAll();openSearch()}});

// ===== Modal umum =====
const modals=['histModal','admModal','tModal','fishModal','pmModal'];
function closeAll(){modals.forEach(id=>$(id).classList.remove('open'));fishTarget=null;pmTarget=null}
modals.forEach(id=>{const m=$(id);m.addEventListener('click',e=>{if(e.target===m||e.target.hasAttribute('data-close'))closeAll()})});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeAll()});
function place(modal,anchor){ // posisikan popup kecil di dekat tombol
  const box=modal.querySelector('.modal-box'),w=box.offsetWidth,h=box.offsetHeight,g=6;let l,t;
  if(anchor){const r=anchor.getBoundingClientRect();l=r.left+r.width/2-w/2;t=r.bottom+g;if(t+h>innerHeight-g)t=r.top-h-g}
  else{l=(innerWidth-w)/2;t=(innerHeight-h)/3}
  box.style.left=Math.max(g,Math.min(l,innerWidth-w-g))+'px';box.style.top=Math.max(g,Math.min(t,innerHeight-h-g))+'px';
}

// ===== Baris tabel =====
function buildRow(t,rank,o){
  const solo_=M==='solo',tr=document.createElement('tr');tr.dataset.id=t.id;
  if(solo_&&t.id===20)tr.classList.add('server');
  if(t.red)tr.classList.add('red');
  if(o.alt)tr.classList.add('alt');
  tr.classList.toggle('blank',!t.name.trim());tr.classList.toggle('zero',t.points<=0);tr.classList.toggle('pos',t.points>0);
  if(!solo_){tr.classList.add('cr');if(o.last)tr.classList.add('last');tr.style.setProperty('--cc',CLAN_COLORS[t.clan-1])}
  else if(t.points>0){
    if(tie[t.points]!==undefined&&rank<=10)tr.classList.add('tie-'+tie[t.points]);
    else if(rank<=3)tr.classList.add('rank-'+rank);
  }

  const tdRank=mk('td','rank');
  const mr=solo_?cr[t.id]||rank:0;
  if(solo_&&t.points>0&&mr<=3)tdRank.appendChild(mk('span','medal m'+mr,mr));else tdRank.textContent=rank;
  if(!(solo_&&t.id===20)){tdRank.classList.add('red-toggle');tdRank.title='Klik untuk tandai MERAH / batalkan';tdRank.addEventListener('click',()=>{t.red=!t.red;tr.classList.toggle('red',t.red)})}

  const tdName=mk('td','name-cell'),ni=mk('input','team-name');ni.type='text';ni.value=t.name;ni.placeholder=solo_?'Nama Peserta':'Nama Akun';
  ni.addEventListener('input',()=>{t.name=ni.value;tr.classList.toggle('blank',!t.name.trim());updateSlotInfo();markClan();renderLog()});tdName.appendChild(ni);

  const tdNick=mk('td','name-cell'),ki=mk('input','team-nick');ki.type='text';ki.value=t.nickname;ki.placeholder='Nama Display';
  ki.addEventListener('input',()=>{t.nickname=ki.value;applySearch();markClan();renderLog()});tdNick.appendChild(ki);

  const tdPts=mk('td','poin-cell'),w=mk('div','points-wrap'),pi=mk('input','points');pi.type='text';pi.value=t.points;pi.readOnly=true;pi.tabIndex=-1;
  const pm=mk('button','pm-btn','±');pm.type='button';pm.title='Tambah / kurangi poin';pm.addEventListener('click',()=>openPm(t.id,pm));
  const fb=mk('button','fish-btn','<img src="'+FISH_IMG+'" alt="" draggable="false">');fb.type='button';fb.title='Tambah poin berdasarkan ikan';fb.addEventListener('click',()=>openFish(t.id));
  w.append(pi,pm,fb);tdPts.appendChild(w);

  let tdPay=null;
  if(solo_){ // kolom Pay: klik = tandai bayar, dblclick = edit
    tdPay=mk('td','center');const p=mk('input','pay-input');p.type='text';p.maxLength=10;p.placeholder='-';p.autocomplete='off';p.value=t.pay||'';
    const fit=()=>{const n=p.value.length;p.style.fontSize=n<=3?'':n===4?'.9em':'.72em'};
    const ref=()=>{const f=(t.pay||'')!=='';p.readOnly=f;if(f)p.value=t.pay.slice(0,3);p.classList.toggle('locked',f);p.classList.toggle('done',f&&t.paid);
      p.title=!f?'Isi angka/huruf dulu':'Isi: '+t.pay+' — klik: tandai bayar/batal, klik 2x: edit';fit()};
    ref();
    p.addEventListener('input',()=>{t.pay=p.value.trim();if(!t.pay)t.paid=false;p.classList.toggle('done',t.paid&&!!t.pay);fit()});
    p.addEventListener('click',()=>{if(p.readOnly){t.paid=!t.paid;ref()}});
    p.addEventListener('dblclick',()=>{p.readOnly=false;p.value=t.pay;fit();p.classList.remove('locked');p.focus();p.select()});
    p.addEventListener('blur',()=>{ref();if(syncBin(t))setTimeout(render,550)});
    p.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();p.blur()}});
    tdPay.appendChild(p);
  }

  const tdJoin=mk('td','center'),jb=mk('button','join-btn','✓');jb.type='button';
  const rj=()=>{jb.classList.toggle('joined',t.joined);jb.title=t.joined?'Sudah absen — klik untuk batalkan':'Belum absen — klik untuk centang'};rj();
  jb.addEventListener('click',()=>{t.joined=!t.joined;rj()});tdJoin.appendChild(jb);

  const tdHist=mk('td','center'),hb=mk('button','hist-btn','<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>');hb.type='button';hb.title='Lihat history poin';
  if(t.history.length)hb.appendChild(mk('span','hist-count',t.history.length));
  hb.addEventListener('click',()=>openHistory(t.id));tdHist.appendChild(hb);

  const cells=solo_?[tdRank,tdName,tdPay,tdNick,tdPts,tdJoin,tdHist]:[tdRank,tdName,tdNick,tdPts,tdJoin,tdHist];
  if(t.flash&&Date.now()-t.flash.time<FLASH_MS){
    tr.classList.add(t.flash.dir==='up'?'flash-up':'flash-down');
    cells.forEach(td=>td.style.animationDelay='-'+(Date.now()-t.flash.time)+'ms');
  }
  tr.append(...cells);return tr;
}

function clanHeader(c,r,total){
  const tr=mk('tr','ch'+(total>0&&r<=3?' rank-'+r:''));
  const PAL={1:['#9A6A00','#FFC400'],2:['#5F6F7A','#B8C4CC'],3:['#7A410C','#E58E3A']},[dk,mn]=PAL[r]||['#0D47A1','#2196F3'];
  const td=mk('td',null,'<div class="chin"><span class="rkw"><svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="29" fill="'+mn+'" stroke="'+dk+'" stroke-width="4"/><text x="32" y="44" text-anchor="middle" font-family="Lexend,Arial" font-weight="800" font-size="36" fill="#fff" stroke="'+dk+'" stroke-width="4" stroke-linejoin="round" paint-order="stroke">'+r+'</text></svg></span><input type="text" class="clan-name" placeholder="'+(M==='duo'?'Nama Tim':'Nama Clan')+'"><span class="cinfo"><span>TOTAL</span><span>POINT</span></span><span class="ctot"><b>'+total+'</b></span></div>');
  td.colSpan=6;tr.style.setProperty('--cc',CLAN_COLORS[c.id-1]);
  const inp=td.querySelector('input');inp.value=c.name;inp.addEventListener('input',()=>{c.name=inp.value;renderLog()});
  tr.appendChild(td);
  if(c.flash&&Date.now()-c.flash.time<FLASH_MS){tr.classList.add(c.flash.dir==='up'?'flash-up':'flash-down');td.style.animationDelay='-'+(Date.now()-c.flash.time)+'ms'}
  return tr;
}

function render(){
  const top=$('tableBodyTop'),bot=$('tableBodyBottom');top.innerHTML='';bot.innerHTML='';$('tableBodyFirst').innerHTML='';
  if(M==='solo'){
    const s=[...solo].sort((a,b)=>b.points-a.points||a.id-b.id);
    ranks(s,t=>t.points,t=>t.binGiven);
    s.forEach((t,i)=>(i<10?top:bot).appendChild(buildRow(t,i+1,{alt:i%2===1})));
  }else{
    const cl=CL(),split=M==='duo'?4:3; // Duo: 4 tim kiri (+riwayat) + 5 tim kanan
    const s=[...cl].sort((a,b)=>cTotal(b)-cTotal(a)||a.id-b.id);
    ranks(s,cTotal,()=>0);
    s.forEach((c,i)=>{
      const body=M==='duo'?(i===0?$('tableBodyFirst'):i<=4?top:bot):(i<split?top:bot); // Duo: peringkat 1 sendiri di paling atas
      if(body.children.length){const sp=mk('tr','cs');const td=mk('td');td.colSpan=6;sp.appendChild(td);body.appendChild(sp)}
      body.appendChild(clanHeader(c,cr[c.id],cTotal(c)));
      const list=cTeams(c).sort((a,b)=>b.points-a.points||a.slot-b.slot);
      list.forEach((t,p)=>body.appendChild(buildRow(t,p+1,{alt:p%2===1,last:p===list.length-1})));
    });
  }
  applySearch();updateSlotInfo();markClan();renderLog();
}

function autoGrow(input){
  const m=mk('span');m.style.cssText='position:absolute;visibility:hidden;white-space:pre;left:-9999px;top:0';input.parentNode.appendChild(m);
  const fit=()=>{const cs=getComputedStyle(input);m.style.font=cs.font;m.style.textTransform=cs.textTransform;m.textContent=input.value||input.placeholder;
    const fs=parseFloat(cs.fontSize),ex=parseFloat(cs.paddingLeft)+parseFloat(cs.paddingRight)+10;
    input.style.width=Math.min(Math.max(m.offsetWidth+ex,fs*5.2),fs*30)+'px'};
  input.addEventListener('input',fit);input.addEventListener('change',fit);input.fitSize=fit;fit();
  if(document.fonts)document.fonts.ready.then(fit);
}

// ===== TIMER: countdown 5 detik, peringatan 5 menit / 1 menit / 10 detik =====
const tDisp=$('timerDisp'),tTxt=$('timerTxt'),tSub=$('timerSub'),tPlay=$('tPlay'),tModal=$('tModal');
const PRE_MS=5000,WARN_MS=300000,FIN_MS=10000;
const IC={play:'<path d="M7 4l13 8-13 8z"/>',pause:'<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>',stop:'<path d="M6 6h12v12H6z"/>'};
const icon=k=>'<svg viewBox="0 0 24 24" fill="currentColor">'+IC[k]+'</svg>';
let tDur=4200000,tState='idle',tRemain=tDur,tEnd=0,cdEnd=0,tWarned=false,lastCd=null,lastSec=null;
function fmtT(ms){const s=Math.max(0,Math.ceil(ms/1000));return Math.floor(s/3600)+':'+String(Math.floor(s%3600/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
const cdEl=$('cdAlert');let cdTimer=null;
function cdAlert(text,cls,ms){cdEl.textContent=text;cdEl.className='cd-alert show '+cls;clearTimeout(cdTimer);cdTimer=setTimeout(cdHide,ms)}
function cdHide(){clearTimeout(cdTimer);cdEl.classList.remove('show')}
function timerUI(){
  tDisp.classList.remove('cd','warn','end','paused','fin');tSub.textContent='';
  if(tState==='cd'){tTxt.textContent=Math.max(1,Math.ceil((cdEnd-Date.now())/1000));tDisp.classList.add('cd');tSub.innerHTML='MULAI<br>DALAM';tPlay.innerHTML=icon('stop');tPlay.title='Batalkan countdown'}
  else if(tState==='run'){tTxt.textContent=fmtT(tRemain);if(tRemain<=FIN_MS)tDisp.classList.add('fin');else if(tRemain<=WARN_MS)tDisp.classList.add('warn');tPlay.innerHTML=icon('pause');tPlay.title='Jeda'}
  else if(tState==='end'){tTxt.textContent='0:00:00';tDisp.classList.add('end');tSub.innerHTML='WAKTU<br>HABIS';tPlay.innerHTML=icon('play');tPlay.title='Mulai lagi'}
  else{tTxt.textContent=fmtT(tRemain);if(tState==='paused')tDisp.classList.add('paused');tPlay.innerHTML=icon('play');tPlay.title=tState==='paused'?'Lanjut':'Mulai (countdown 5 detik)'}
}
function timerTick(){
  const now=Date.now();
  if(tState==='cd'){
    const left=cdEnd-now,n=Math.ceil(left/1000);
    if(n!==lastCd){lastCd=n;if(n>0)beep(n<=3?1100:700,.12,.25)}
    if(left<=0){tState='run';tEnd=now+tRemain;lastSec=null;beep(1500,.6,.35)}
  }else if(tState==='run'){
    tRemain=tEnd-now;
    if(!tWarned&&tRemain<=WARN_MS){tWarned=true;[0,.3,.6].forEach(a=>beep(1000,.2,.3,a))}
    if(tRemain>0){const sec=Math.ceil(tRemain/1000);
      if(sec!==lastSec){lastSec=sec;
        if(sec===300)cdAlert('SISA 5 MENIT','warn',4000);else if(sec===60)cdAlert('SISA 1 MENIT','warn',4000);
        else if(sec<=10){cdAlert(String(sec),'num',1300);beep(sec<=3?1500:1200,.18,.35)}}}
    if(tRemain<=0){tRemain=0;tState='end';timerEnded=true;markClan();cdAlert('WAKTU HABIS','end',6000);[[1200,0],[1200,.45],[1200,.9]].forEach(([f,a])=>beep(f,.3,.3,a));beep(900,.8,.3,1.35)}
  }
  timerUI();
}
function timerReset(){tState='idle';tRemain=tDur;tWarned=false;lastCd=null;lastSec=null;timerEnded=false;cdHide();markClan();timerUI()}
tPlay.addEventListener('click',()=>{
  cdHide();
  if(tState==='idle'||tState==='end'){if(tState==='end')tRemain=tDur;tWarned=tRemain<=WARN_MS;lastCd=null;lastSec=null;timerEnded=false;tState='cd';cdEnd=Date.now()+PRE_MS}
  else if(tState==='cd')tState='idle';
  else if(tState==='run'){tRemain=tEnd-Date.now();tState='paused'}
  else if(tState==='paused'){tState='run';tEnd=Date.now()+tRemain}
  timerTick();
});
$('tReset').addEventListener('click',timerReset);
$('tSet').addEventListener('click',()=>{const s=Math.round(tDur/1000);$('tH').value=Math.floor(s/3600);$('tM').value=Math.floor(s%3600/60);$('tS').value=s%60;tModal.classList.add('open')});
$('tOk').addEventListener('click',()=>{
  const v=id=>Math.max(0,parseInt($(id).value,10)||0),total=(v('tH')*3600+v('tM')*60+v('tS'))*1000;
  if(total>0){tDur=total;timerReset()}closeAll();
});
setInterval(timerTick,200);timerUI();

// ===== Mode, tema, skala =====
const COLS={solo:[6,23,7,31,22,5,5],clan:[6,28,35,18.5,6,6.5],duo:[6,28,35,18.5,6,6.5]};
function fitToScreen(){
  const wrap=document.querySelector('.wrap'),avail=document.documentElement.clientWidth-20;
  if(M==='duo'){ // full layar: bar atas ukuran Clan (lebar 1700), bagian tim mengecil/membesar sampai pas tinggi layar
    const z=Math.max(.2,Math.min(avail/1700,1.6)),hmax=innerHeight/z,root=document.documentElement;let ts=1;
    wrap.style.zoom=1;wrap.style.width='1700px';
    const sync=()=>{root.style.setProperty('--ts',ts);
      const rs=[...document.querySelectorAll('#tableBodyFirst tr')].slice(0,3),bh=rs.reduce((a,r)=>a+r.offsetHeight,0); // tinggi panel riwayat = 1 blok tim
      if(bh){document.querySelector('.log-panel').style.height=bh+'px';root.style.setProperty('--lr',((bh-4)/3)+'px')}};
    for(let k=0;k<5;k++){
      sync();
      const T=($('firstRow').offsetHeight+$('mainTables').offsetHeight)||1,N=wrap.offsetHeight-T;
      ts=Math.max(.35,Math.min(ts*(hmax-N)/T,1.6));
    }
    sync();wrap.style.zoom=z;return;
  }
  wrap.style.width='';document.querySelector('.log-panel').style.height='';
  const W=M==='solo'?1400:1700;
  wrap.style.zoom=Math.max(.2,Math.min(avail/W,1.6));
}
function setMode(m){
  M=m;document.body.classList.remove('solo','clan','duo');document.body.classList.add(m==='solo'?'solo':'clan');if(m==='duo')document.body.classList.add('duo'); // Duo memakai tampilan Clan
  document.querySelectorAll('colgroup').forEach(cg=>cg.innerHTML=COLS[m].map(w=>'<col style="width:'+w+'%">').join(''));
  document.title=m==='solo'?'Klasemen Galatama Solo':m==='duo'?'Klasemen Galtam Duo':'Klasemen Galtam Clan';
  const br=document.querySelector('.bottom-row');(m==='duo'?$('colF'):document.querySelector('.panel')).appendChild(br); const cp=document.querySelector('.copyright');(m==='duo'?document.querySelector('.panel'):br).appendChild(cp); // Duo: riwayat di kiri bawah, Created By di paling bawah
  $('firstRow').style.display=m==='duo'?'grid':'none';
  $('menu').classList.remove('open');closeAll();render();fitToScreen();
}
$$('#menu [data-mode]').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));
$('menuFab').addEventListener('click',()=>{closeAll();$('menu').classList.add('open')}); // data semua mode tetap tersimpan
$('themeFab').addEventListener('click',()=>{
  const dark=document.documentElement.getAttribute('data-theme')==='dark';
  if(dark)document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme','dark');
  try{localStorage.setItem('galTheme',dark?'light':'dark')}catch(e){}
});
addEventListener('resize',fitToScreen);if(document.fonts)document.fonts.ready.then(()=>M&&fitToScreen());
document.addEventListener('pointerdown',()=>window.focus(),{once:true});

</script>
